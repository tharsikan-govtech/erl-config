# Properties to add to Certify (e.g. certify-service/src/main/resources/application-local.properties)
# for the eRL pre-authorized code flow. Everything else comes from the stock local config.

mosip.certify.plugin-mode=DataProvider
mosip.certify.integration.data-provider-plugin=PreAuthDataProviderPlugin

# Issuer DID, hosted on GitHub Pages (see README: did/did.json)
mosip.certify.data-provider-plugin.did-url=did:web:tharsikan-govtech.github.io:erl-config:did

# Authorization server for the credential config (Certify itself in the pre-auth flow)
mosip.certify.credential-config.as-mapping={"ErlCredential":"http://localhost:8090"}

# Allow Certify to fetch our JSON-LD context from GitHub Pages
mosip.certify.jsonld.remote.allowedHosts[3]=tharsikan-govtech.github.io
mosip.certify.jsonld.contexts[https\://tharsikan-govtech.github.io/erl-config/contexts/erl.json].resource=https://tharsikan-govtech.github.io/erl-config/contexts/erl.json
mosip.certify.jsonld.contexts[https\://tharsikan-govtech.github.io/erl-config/contexts/erl.json].preload=false
mosip.certify.jsonld.contexts[https\://tharsikan-govtech.github.io/erl-config/contexts/erl.json].cache=true
